org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# nanoMuse: a newer lint than AGP 8.7.3 bundles (31.7.3). The Compose and lifecycle libraries ship
# lint checks compiled against a newer Kotlin analysis API, and the bundled lint crashes on them
# (IncompatibleClassChangeError in the detectors, `./gradlew :app:lintDebug` never finished). The
# property takes an AGP-style version: 8.13.0 is lint 31.13.0, which reads them; AGP itself is unchanged.
android.experimental.lint.version=8.13.0

# Clawdy build host (aarch64 Linux): run x86_64 aapt2 under qemu
android.aapt2FromMavenOverride=/workspace/tools/aapt2
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.incremental=true
ksp.incremental=false
android.suppressUnsupportedCompileSdk=36
